<!DOCTYPE html>
<html lang="en">
<head>
    <title>AI Chatbot Portfolio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            text-align: center;
        }

        h1 {
            margin-bottom: 30px;
        }

        .card {
            display: block;
            background: #1e293b;
            padding: 15px 25px;
            margin: 10px;
            border-radius: 10px;
            text-decoration: none;
            color: white;
            transition: 0.3s;
            width: 250px;
        }

        .card:hover {
            background: #3b82f6;
            transform: scale(1.05);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>AI Chatbot Portfolio 🤖</h1>

        <a class="card" href="/rule_based">Rule-Based Chatbot</a>
        <a class="card" href="/llm">LLM Chatbot</a>
        <a class="card" href="/rag">RAG Chatbot</a>
    </div>
</body>
</html>
