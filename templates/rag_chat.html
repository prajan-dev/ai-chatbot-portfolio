<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RAG Chatbot</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b1220;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #e5e7eb;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: #111827;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 {
            text-align: center;
            color: #34d399;
            margin-bottom: 20px;
            font-size: 24px;
        }

        form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            outline: none;
            font-size: 14px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background: #10b981;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #059669;
        }

        .response-box {
            background: #1f2937;
            padding: 15px;
            border-radius: 10px;
            min-height: 70px;
            white-space: pre-wrap;
            border-left: 4px solid #34d399;
        }

        .label {
            font-weight: bold;
            color: #9ca3af;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #60a5fa;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>RAG Chatbot </h1>

    <form method="POST">
        <input type="text" name="user_input" placeholder="Ask from your documents..." required>
        <button type="submit">Send</button>
    </form>

    <div class="response-box">
        <span class="label">Response:</span><br>
        {{ response }}
    </div>

    <a class="back" href="/">← Back to Home</a>
</div>

</body>
</html>
