<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LLM Chatbot</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #e2e8f0;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: #111827;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #60a5fa;
        }

        form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            outline: none;
            font-size: 14px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background: #3b82f6;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #2563eb;
        }

        .response {
            background: #1f2937;
            padding: 15px;
            border-radius: 10px;
            min-height: 60px;
            white-space: pre-wrap;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #93c5fd;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>LLM Chatbot 🤖</h1>

    <form method="POST">
        <input type="text" name="user_input" placeholder="Ask anything..." required>
        <button type="submit">Send</button>
    </form>

    <div class="response">
        <b>Response:</b><br>
        {{ response }}
    </div>

    <a class="back" href="/">← Back to Home</a>
</div>

</body>
</html>
